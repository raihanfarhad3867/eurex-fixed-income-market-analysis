name: Extract uploaded project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="eurex-fixed-income-activity-project.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP already removed; nothing to extract."
            exit 0
          fi

          rm -rf /tmp/eurex-project
          mkdir -p /tmp/eurex-project
          unzip -q "$ZIP" -d /tmp/eurex-project

          SRC="/tmp/eurex-project/eurex-fixed-income-activity-project"
          test -d "$SRC"

          rsync -a "$SRC"/ ./
          rm -f "$ZIP"
          rm -f .github/workflows/extract-project.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Organize fixed-income market analysis project"
          git push origin HEAD:main
